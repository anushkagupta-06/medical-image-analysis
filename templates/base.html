<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        PneumoAI
        {% endblock %}
    </title>

    <link rel="stylesheet"
          href="{{ url_for('static',
          filename='css/style.css') }}">

</head>

<body>

    <nav class="navbar">

        <div class="brand">
            <span class="brand-icon">◉</span>

    </main>


    <footer>

        <p>
            PneumoAI — AI-assisted medical image analysis

        <p class="disclaimer">
            For educational and research purposes only.
        </p>

    </footer>
